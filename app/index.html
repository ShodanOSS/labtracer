<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabTracer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='5' width='20' height='5' rx='1' fill='%234cc2ff'/%3E%3Crect x='2' y='14' width='20' height='5' rx='1' fill='%23ffc857'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo"></span>LabTracer</div>
  <button id="btn-file" class="tb">File ▾</button>
  <span id="lab-name" class="labname"></span>
  <button id="btn-save" class="tb" title="Save (Ctrl+S)">Save</button>
  <span class="sep"></span>
  <div class="seg">
    <button class="tb" data-mode="topo" title="Logical topology (1)">Topology</button>
    <button class="tb" data-mode="room" title="Physical room (2)">Room</button>
    <button class="tb" data-mode="inventory" title="Inventory table (3)">Inventory</button>
  </div>
  <select id="room-select" class="tb-select" title="Room"></select>
  <span class="sep view3d"></span>
  <div class="seg view3d">
    <button class="tb on" data-tool="select" title="Select and move (V)">Select</button>
    <button class="tb" data-tool="link" title="Connect devices (L)">Link</button>
  </div>
  <select id="link-medium" class="tb-select view3d" title="Cable type for new links"></select>
  <span class="sep"></span>
  <button id="btn-undo" class="tb" title="Undo (Ctrl+Z)">↶</button>
  <button id="btn-redo" class="tb" title="Redo (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <button id="btn-fit" class="view3d tb" title="Fit view (F)">Fit</button>
  <button id="btn-top" class="view3d tb" title="Top-down (T)">Top</button>
  <button id="tg-labels" class="view3d tb tg" title="Device labels">Labels</button>
  <button id="tg-ports" class="view3d tb tg" title="Port names on links">Ports</button>
  <button id="tg-cables" class="view3d tb tg" title="Cables in room view">Cables</button>
  <button id="tg-snap" class="view3d tb tg" title="Snap to grid">Snap</button>
  <span class="sep"></span>
  <button id="tg-live" class="tb tg live" title="Live status from the check agent">Live</button>
  <span class="grow"></span>
  <span id="mode-badge" class="badge-mode"></span>
  <button id="btn-help" class="tb" title="Help (?)">?</button>
</header>
<main>
  <aside id="palette"></aside>
  <section id="viewport"></section>
  <aside id="inspector"></aside>
</main>
<footer id="status"><span id="status-left"></span><span id="status-right"></span></footer>
<div id="overlay"></div>
<div id="toasts"></div>
<noscript>LabTracer needs JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
